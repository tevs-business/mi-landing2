# ─────────────────────────────────────────────
#  KRONOS · Configuración de seguridad Netlify
# ─────────────────────────────────────────────

[build]
  publish = "."

# ── Headers de seguridad HTTP ──────────────────
[[headers]]
  for = "/*"
  [headers.values]

    # Fuerza HTTPS siempre (1 año, incluye subdominios)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Evita que el sitio sea embebido en iframes de otros dominios (clickjacking)
    X-Frame-Options = "DENY"

    # Evita que el navegador adivine el tipo de contenido (MIME sniffing)
    X-Content-Type-Options = "nosniff"

    # Controla qué información se envía al hacer clic en links externos
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Desactiva funciones sensibles del navegador que no se usan
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Content Security Policy: define exactamente qué puede cargar la página
    # Ajustado para permitir Google Fonts, Google Maps y WhatsApp
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https://images.unsplash.com https://www.google.com;
      frame-src https://www.google.com https://maps.google.com;
      connect-src 'self';
      form-action 'self';
      base-uri 'self';
      object-src 'none';
    """

    # Protección XSS para navegadores antiguos
    X-XSS-Protection = "1; mode=block"

# ── Caché óptimo para performance ─────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ──────────────────────────────────
# Redirige www a sin-www (o al revés, según el dominio elegido)
[[redirects]]
  from = "https://www.kronoscentromedico.com.ar/*"
  to   = "https://kronoscentromedico.com.ar/:splat"
  status = 301
  force  = true

# Página 404 personalizada
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
